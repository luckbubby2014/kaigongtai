<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开工台 · 我的工作台</title>
<meta name="description" content="开工台工作界面：管理项目、安排下一步、保存参考资料、记录工作进度。数据默认保存在你自己的浏览器里。">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">开</span>开工台</a>
    <nav class="nav">
      <a href="index.html#features">功能</a>
      <a href="help.html">使用帮助</a>
      <a href="faq.html">常见问题</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-ghost btn-small" id="btn-export" type="button">导出备份</button>
      <button class="btn btn-ghost btn-small" id="btn-import" type="button">导入</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<div class="app-shell">

  <aside class="app-side">
    <div class="side-actions">
      <button class="btn btn-small" id="btn-new-project" type="button">＋ 新建项目</button>
    </div>

    <div>
      <h4>项目</h4>
      <div class="side-filters" id="project-filters">
        <button class="filter-chip on" data-filter="all" type="button">全部</button>
        <button class="filter-chip" data-filter="active" type="button">进行中</button>
        <button class="filter-chip" data-filter="paused" type="button">暂停中</button>
        <button class="filter-chip" data-filter="done" type="button">已完成</button>
      </div>
      <div class="project-list" id="project-list"></div>
    </div>

    <div class="side-actions">
      <button class="btn btn-ghost btn-small" id="btn-inbox" type="button">收集箱 <span id="inbox-count"></span></button>
      <button class="btn-ghost btn-plain" id="btn-today" type="button">← 今天从哪继续</button>
    </div>

    <p class="small muted" style="margin-top:auto;margin-bottom:0">
      数据保存在本机浏览器中，不会自动上传。<a href="privacy.html" style="text-decoration:underline">隐私说明</a>
    </p>
  </aside>

  <main class="app-main" id="app-main"></main>

</div>

<footer class="site-footer" style="padding:28px 0">
  <div class="wrap">
    <div class="footer-legal" style="border-top:none;padding-top:0">
      <span>© <span data-year>2026</span> 开工台</span>
      <a href="index.html">首页</a>
      <a href="help.html">使用帮助</a>
      <a href="privacy.html">隐私政策</a>
      <a href="terms.html">服务条款</a>
      <a href="disclaimer.html">免责声明</a>
    </div>
    <p class="footer-note">本工具仅供个人计划与记录使用，不保证数据在任何情况下不丢失，请定期使用“导出备份”保存数据。</p>
  </div>
</footer>

<script src="assets/app.js"></script>
<script>
  document.querySelectorAll('[data-year]').forEach(function (el) {
    el.textContent = new Date().getFullYear();
  });
</script>

</body>
</html>
